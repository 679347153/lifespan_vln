# ──────────────────────────────────────────────────────────────
# 场景 00814-p53SfW6mjZe 变更脚本 (Medium 难度)
# 2 room, 275 objects, 5 epochs (Day 1/3/7/14/30)
# ──────────────────────────────────────────────────────────────
scene_id: "00814-p53SfW6mjZe"
base_map: "RAG_Graph/scene_build/deep_explore_v2/00814-p53SfW6mjZe_semantic_map.json"
n_epochs: 5
epoch_days: [1, 3, 7, 14, 30]

changes:
  # ===== HRO: 高频迁移物体 (几乎每 epoch 位置变化) =====

  - obj_id: "chair_1_R0"
    label: "chair"
    type: HRO
    positions:
      T0: {room: R0, pos_3d: [-15.55, 1.49, -5.98]}    # 原始位置
      T1: {room: R0, pos_3d: [-13.50, 1.49, -4.50]}    # 移到 R0 另一侧
      T2: {room: R0, pos_3d: [-15.55, 1.49, -5.98]}    # 回到原位
      T3: {room: R1, pos_3d: [-1.50, 1.49, 5.00]}      # 移到 R1
      T4: {room: R0, pos_3d: [-15.00, 1.49, -6.20]}    # 回到 R0 附近

  - obj_id: "cushion_3_R0"
    label: "cushion"
    type: HRO
    positions:
      T0: {room: R0, pos_3d: [-14.51, 2.03, -5.30]}
      T1: {room: R0, pos_3d: [-13.00, 2.03, -5.00]}    # 微移 (同房间)
      T2: {room: R0, pos_3d: [-14.26, 2.10, 4.47]}     # 移到 R0 远端 (cushion_6 附近)
      T3: {room: R0, pos_3d: [-13.00, 2.03, -5.00]}    # 回到之前位置
      T4: {room: R0, pos_3d: [-14.51, 2.03, -5.30]}    # 回到原位

  - obj_id: "stool_5_R0"
    label: "stool"
    type: HRO
    positions:
      T0: {room: R0, pos_3d: [-13.68, 1.73, -4.54]}
      T1: {room: R0, pos_3d: [-12.50, 1.73, -3.00]}
      T2: {room: R0, pos_3d: [-13.68, 1.73, -4.54]}    # 回到原位
      T3: {room: R0, pos_3d: [-10.50, 2.00, -1.50]}    # 移到 R0 中部
      T4: {room: R0, pos_3d: [-12.50, 1.73, -3.00]}    # 在两点之间

  # ===== LRO: 低频迁移物体 (仅 1-2 次移动) =====

  - obj_id: "lamp_2_R0"
    label: "lamp"
    type: LRO
    positions:
      T0: {room: R0, pos_3d: [-7.39, 1.27, 2.51]}
      # T1: 不变 (沿用 T0)
      T2: {room: R0, pos_3d: [-13.00, 1.27, -4.00]}    # 移到 R0 另一区域
      # T3/T4: 保持在新位置

  - obj_id: "basket_2_R0"
    label: "basket"
    type: LRO
    positions:
      T0: {room: R0, pos_3d: [-10.64, 2.27, -1.13]}
      # T1/T2: 不变
      T3: {room: R1, pos_3d: [-1.00, 2.00, 4.50]}     # 移到 R1
      # T4: 保持在 R1

  # ===== DO: 消失物体 =====

  - obj_id: "box_4_R0"
    label: "box"
    type: DO
    positions:
      T0: {room: R0, pos_3d: [-13.07, 1.56, -3.21]}
      T1: {room: R0, pos_3d: [-13.07, 1.56, -3.21]}    # 还在
      T2: null                                           # T2 起消失

  - obj_id: "toy_1_R0"
    label: "toy"
    type: DO
    positions:
      T0: {room: R0, pos_3d: [-2.25, 2.02, -1.75]}
      T1: {room: R0, pos_3d: [-2.25, 2.02, -1.75]}
      T2: {room: R0, pos_3d: [-2.25, 2.02, -1.75]}
      T3: null                                           # T3 起消失

  # ===== NO: 新增物体 =====

  - obj_id: ~
    label: "speaker"
    type: "NO"
    positions:
      T2: {room: R0, pos_3d: [-14.00, 1.50, -5.00]}     # T2 首次出现

  - obj_id: ~
    label: "bowl"
    type: "NO"
    positions:
      T3: {room: R0, pos_3d: [-12.00, 2.20, -2.50]}     # T3 首次出现
