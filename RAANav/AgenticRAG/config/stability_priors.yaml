  pillow: 0.30
  cushion: 0.35
  vase: 0.35
  towel: 0.25
  bottle: 0.20
  cup: 0.20
  basket: 0.35
  box: 0.30
  bag: 0.15
  shoe: 0.15
  bowl: 0.25
  book: 0.20
  toy: 0.20
  clothes: 0.15
