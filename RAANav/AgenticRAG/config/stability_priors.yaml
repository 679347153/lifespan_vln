  cabinet: 0.85
  kitchen cabinet: 0.85
  bathroom cabinet: 0.85
  dresser: 0.85
  wardrobe: 0.85
  tv: 0.75
  monitor: 0.70
  microwave: 0.70
  stove: 0.90
  dishwasher: 0.90
  # --- 中等稳定 (0.4-0.7): 中型家具/装饰 ---
  chair: 0.65
  dining chair: 0.65
  stool: 0.60
  lamp: 0.60
  ceiling lamp: 0.90
  bedside lamp: 0.60
  plant: 0.55
  mirror: 0.70
  rug: 0.65
  carpet: 0.65
  mat: 0.55
  curtain: 0.70
  picture: 0.70
  painting: 0.70
  clock: 0.65
