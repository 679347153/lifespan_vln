# ---------------------------------------------------------------------------
# 静态 stability 字典 (物体动态稳定性先验, 0=极易移动, 1=几乎不动)
# 优先使用此字典, 缺失时回退到 default_stability
# ---------------------------------------------------------------------------
stability_priors:
  default: 0.5
  # --- 高稳定 (≥0.9): 建筑固定/大型家电 ---
  toilet: 0.95
  bathtub: 0.95
  sink: 0.95
  refrigerator: 0.95
  oven: 0.90
  washer: 0.90
  dryer: 0.90
  fireplace: 0.95
  counter: 0.90
  shower: 0.95
  # --- 中高稳定 (0.7-0.9): 大型家具 ---
  bed: 0.85
  sofa: 0.85
  couch: 0.85
  desk: 0.80
  table: 0.80
  dining table: 0.80
  coffee table: 0.80
  bookshelf: 0.85
